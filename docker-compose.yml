version: '3.8'

services:
  app:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/project
    depends_on:
      - postgres
    environment:
      - DOCKER=true
      - DB_HOST=postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: github_quality_test
