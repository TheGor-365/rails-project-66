ru:
  date:
    month_names: [~, января, февраля, марта, апреля, мая, июня, июля, августа, сентября, октября, ноября, декабря]
    formats:
      default: "%d.%m.%Y"
      short: "%d.%m.%Y"
      long: "%d %B %Y"

  time:
    formats:
      default: "%d.%m.%Y %H:%M"
      short: "%d.%m.%Y %H:%M"
      long: "%d %B %Y, %H:%M"
