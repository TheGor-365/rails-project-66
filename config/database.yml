default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", ENV.fetch("PGHOST", "/var/run/postgresql")) %>
  port: <%= ENV.fetch("DB_PORT", ENV.fetch("PGPORT", 5432)) %>
  username: <%= ENV.fetch("DB_USERNAME", ENV.fetch("PGUSER", ENV.fetch("USER", nil))) %>
  password: <%= ENV["DB_PASSWORD"] || ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: github_quality_development

test:
  <<: *default
  database: github_quality_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
