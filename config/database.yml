<%
  in_container = File.exist?("/.dockerenv") ||
                 (ENV["DOCKER"] && !ENV["DOCKER"].empty?)

  in_ci = (ENV["CI"] && !ENV["CI"].empty?)

  default_socket = "/var/run/postgresql"

  default_host =
    if in_container
      "postgres"
    elsif in_ci
      "127.0.0.1"
    else
      default_socket
    end

  default_user =
    if in_container || in_ci
      "postgres"
    else
      ENV["USER"]
    end
%>

<%
db_password = ENV["DB_PASSWORD"]
db_password = nil if db_password.to_s.strip.empty?

pg_password = ENV["PGPASSWORD"]
pg_password = nil if pg_password.to_s.strip.empty?

postgres_password = ENV["POSTGRES_PASSWORD"]
postgres_password = nil if postgres_password.to_s.strip.empty?

db_url_password = nil
begin
  require "uri"
  u = ENV["DATABASE_URL"]
  if u && !u.to_s.strip.empty?
    db_url_password = URI(u).password
    db_url_password = nil if db_url_password.to_s.strip.empty?
  end
rescue StandardError
  db_url_password = nil
end
%>

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", ENV.fetch("PGHOST", default_host)) %>
  port: <%= ENV.fetch("DB_PORT", ENV.fetch("PGPORT", 5432)) %>
  username: <%= ENV.fetch("DB_USERNAME", ENV.fetch("PGUSER", default_user)) %>
  password: <%= db_password || pg_password || postgres_password || db_url_password || (in_container ? "postgres" : nil) %>

development:
  <<: *default
  database: github_quality_development

# Test environment: switch to SQLite to avoid requiring Postgres in CI/tests.
test:
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000
  database: db/test.sqlite3

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
